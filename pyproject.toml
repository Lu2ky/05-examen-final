[project]
name = "examen-final-05"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.1",
    "mcp>=2.2,<3",
    "numpy>=2.4.6",
    "openai>=3.46.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
